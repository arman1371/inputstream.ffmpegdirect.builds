name: Build inputstream.ffmpegdirect
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PACKAGE_NAME: 'inputstream.ffmpegdirect'

jobs:
  build:
    strategy:
      matrix:
        arch: ['x86_64', 'x86', 'aarch64', 'armv7', 'armhf']
    runs-on: ubuntu-latest
    steps:
      - uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.arch }}
          branch: v3.21
          packages: >
            build-base
            cmake
            git
            autoconf
            automake
            gettext-dev
            libtool
      
      - uses: actions/checkout@v4
        with:
          repository: 'xbmc/xbmc'
          ref: '21.0-Omega'
          path: xbmc

      - uses: actions/checkout@v4
        with:
          repository: 'xbmc/${{env.PACKAGE_NAME}}'
          ref: '21.3.7-Omega'
          path: ${{env.PACKAGE_NAME}}

      - name: Create build directory
        run: |
          mkdir ${{env.PACKAGE_NAME}}/build
      
      - name: cmake
        shell: alpine.sh {0}
        run: |
          cd ${{env.PACKAGE_NAME}}/build
          cmake -DADDONS_TO_BUILD=${{env.PACKAGE_NAME}} -DADDON_SRC_PREFIX=../.. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=../../xbmc/build/addons -DPACKAGE_ZIP=1 ../../xbmc/cmake/addons
      
      - name: make
        shell: alpine.sh {0}
        run: |
          cd ${{env.PACKAGE_NAME}}/build
          make -j$(nproc) || cat build/libzvbi/src/libzvbi/src/io-sim.c
      
      - name: Package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.PACKAGE_NAME}}
          path: |
            xbmc/cmake/addons